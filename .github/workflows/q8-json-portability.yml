name: Q8 JSON portability verification

on:
  push:
    branches: [q8-json-portability-validation-20261018]
    paths: [.github/workflows/q8-json-portability.yml]

permissions:
  contents: read

jobs:
  linux-longdouble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install exact test dependencies
        run: python -m pip install numpy==1.26.4 pandas==1.5.3 scipy==1.14.1 scikit-learn==1.5.1 pytest==7.0.1 pytest-mock==3.6.1 requests==2.32.3
      - name: Verify extended exponent range is actually available
        run: |
          python - <<'PY'
          import numpy as np
          assert np.finfo(np.longdouble).max > np.finfo(float).max
          print('NumPy:', np.__version__, 'longdouble bits:', np.finfo(np.longdouble).bits)
          PY
      - name: Reproduce all ten finite-longdouble failures on original source
        shell: bash
        run: |
          mkdir baseline
          git archive a4aac60e259b879292679ed1a23f2b7395d6b296 raiutils | tar -x -C baseline
          cp raiutils/tests/test_data_processing_utils.py baseline/raiutils/tests/
          set +e
          PYTHONPATH="$PWD/baseline/raiutils" python -m pytest baseline/raiutils/tests/test_data_processing_utils.py -k longdouble -q --junitxml=baseline.xml > baseline.log 2>&1
          status=$?
          set -e
          cat baseline.log
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('baseline.xml').getroot()
          assert len(root.findall('.//failure')) == 10
          assert not root.findall('.//error')
          assert not root.findall('.//skipped')
          print('Confirmed 10 original failures; no errors or skipped cases.')
          PY
      - name: Run complete corrected raiutils suite
        env:
          PYTHONPATH: ${{ github.workspace }}/raiutils
        run: python -m pytest raiutils/tests -q --junitxml=corrected.xml
      - name: Require all 126 cases to pass without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('corrected.xml').getroot()
          assert len(root.findall('.//testcase')) == 126
          assert not root.findall('.//failure')
          assert not root.findall('.//error')
          assert not root.findall('.//skipped')
          print('Verified 126 passing cases, zero failures/errors/skips.')
          PY

